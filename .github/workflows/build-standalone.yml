name: Build standalone HTML

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify repository
        shell: powershell
        run: .\scripts\check-repository.ps1
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-redactor-standalone
          path: |
            dist/index.html
            dist/index.self-extract.html
            dist/self-extract-manifest.json
            dist/.nojekyll
          if-no-files-found: error
